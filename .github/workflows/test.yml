name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Pinned for float determinism — changing this requires re-blessing
          # the reference baseline.
          node-version: '20.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (framework + energy model + aging-places)
        run: npm test

      - name: Regression check (scenario outputs vs. blessed baseline)
        run: npm run regression

  # The tsimulation framework has no float-determinism constraint, so it is
  # exercised on its own across multiple Node versions to guard portability.
  framework:
    name: framework package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build framework
        run: npm run build:framework

      - name: Framework tests
        run: npm run test:framework
