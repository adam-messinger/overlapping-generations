<svg xmlns="http://www.w3.org/2000/svg" width="740" height="170" viewBox="0 0 740 170" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial" font-size="12">
<rect width="740" height="170" fill="#fcfcfb"/>
<text x="16" y="24" font-size="14" font-weight="600" fill="#0b0b0b">Continuous coupled questions (quantiles, never extremized)</text>
<text x="16" y="42" font-size="11" fill="#52514e">Solid bar = Vincentized ensemble mean P10-P90; dashed = spread of panelist P50s</text>
<line x1="300.0" y1="56" x2="300.0" y2="124" stroke="#e4e3df" stroke-width="1"/>
<text x="300.0" y="142" text-anchor="middle" font-size="10" fill="#52514e">0.6</text>
<line x1="400.0" y1="56" x2="400.0" y2="124" stroke="#e4e3df" stroke-width="1"/>
<text x="400.0" y="142" text-anchor="middle" font-size="10" fill="#52514e">1.4</text>
<line x1="500.0" y1="56" x2="500.0" y2="124" stroke="#e4e3df" stroke-width="1"/>
<text x="500.0" y="142" text-anchor="middle" font-size="10" fill="#52514e">2.1</text>
<line x1="600.0" y1="56" x2="600.0" y2="124" stroke="#e4e3df" stroke-width="1"/>
<text x="600.0" y="142" text-anchor="middle" font-size="10" fill="#52514e">2.8</text>
<line x1="700.0" y1="56" x2="700.0" y2="124" stroke="#e4e3df" stroke-width="1"/>
<text x="700.0" y="142" text-anchor="middle" font-size="10" fill="#52514e">3.6</text>
<rect x="300" y="50" width="34" height="8" rx="4" fill="#b7d3f6"/>
<text x="340" y="58" font-size="10" fill="#52514e">P10-P90 (ensemble mean)</text>
<line x1="496" y1="48" x2="496" y2="60" stroke="#2a78d6" stroke-width="3"/>
<text x="502" y="58" font-size="10" fill="#52514e">P50</text>
<text x="288" y="83.0" text-anchor="end" fill="#0b0b0b">CQ3 (%/yr real GDP growth)</text>
<rect x="333.3" y="74.0" width="273.9" height="10" rx="5" fill="#b7d3f6"/>
<line x1="419.7" y1="79.0" x2="522.0" y2="79.0" stroke="#52514e" stroke-width="1" stroke-dasharray="2 2"/>
<line x1="467.5" y1="69.0" x2="467.5" y2="89.0" stroke="#2a78d6" stroke-width="3"/>
<text x="708" y="83.0" font-size="11" font-weight="600" fill="#0b0b0b">1.85</text>
<title>CQ3 (%/yr real GDP growth): mean P10/P50/P90 0.87/1.85/2.88; median 0.90/1.80/2.85; panelist P50 range 1.50-2.25</title>
<text x="288" y="113.0" text-anchor="end" fill="#0b0b0b">CQ4 (% real yield)</text>
<rect x="334.8" y="104.0" width="331.9" height="10" rx="5" fill="#b7d3f6"/>
<line x1="372.0" y1="109.0" x2="556.1" y2="109.0" stroke="#52514e" stroke-width="1" stroke-dasharray="2 2"/>
<line x1="491.6" y1="99.0" x2="491.6" y2="119.0" stroke="#2a78d6" stroke-width="3"/>
<text x="708" y="113.0" font-size="11" font-weight="600" fill="#0b0b0b">2.03</text>
<title>CQ4 (% real yield): mean P10/P50/P90 0.88/2.03/3.31; median 0.95/2.10/3.30; panelist P50 range 1.15-2.50</title>
